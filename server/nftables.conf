# ===================================================================
# nftables — Firewall del servidor (red única 192.168.0.0/24)
# ===================================================================
# Aplicar en el servidor:
#   sudo bash server/deploy.sh
#
# Verificar:
#   sudo nft list ruleset
#
# Red:  única 192.168.0.0/24 (admins + usuarios + clientes).
# La separación de tráfico se compensa con firewall por host + auth AD.
#
# ATENCIÓN: NO usar "flush ruleset" en este archivo. Docker crea sus
# propias cadenas (DOCKER, DOCKER-USER, NAT) y un flush global las
# borra, rompiendo el mapeo de puertos de los contenedores.
# Este config solo define la tabla `inet filter`; deploy.sh borra
# únicamente ESA tabla antes de recargar.
# ===================================================================
table inet filter {

    # ── IPs de los administradores (SSH/Portainer/DB) ──
    # Completar con las IPs de los notebooks de admins.
    set admin_ips {
        type ipv4_addr
        flags interval
        elements = {
            192.168.0.50,
            192.168.0.51,
            192.168.0.52
        }
    }

    # ── INPUT ────────────────────────────────────────────
    chain input {
        type filter hook input priority filter; policy drop;

        # Conexiones ya establecidas
        ct state established,related accept

        # Conexiones con estado inválido
        ct state invalid drop

        # Loopback
        iif "lo" accept

        # ─── MITIGACIÓN DE ESCANEOS DE PUERTOS (Port Scan Defense) ───
        # Escaneo TCP NULL (sin flags)
        tcp flags & (fin|syn|rst|psh|ack|urg) == 0 drop
        # Escaneo TCP XMAS (FIN, PSH, URG activos)
        tcp flags & (fin|syn|rst|psh|ack|urg) == fin|psh|urg drop
        # Escaneo TCP SYN-FIN (combinación anómala)
        tcp flags & (syn|fin) == syn|fin drop

        # ─── MITIGACIÓN DE DDoS (SYN Flood & Connection Exhaustion) ───
        # Limitar ráfagas excesivas de conexiones nuevas TCP SYN en los puertos
        tcp flags syn / fin,syn,rst,ack limit rate over 40/second burst 80 packets drop

        # Limitar a máximo 30 conexiones simultáneas por IP a los puertos web del host
        tcp dport { 80, 443, 8080, 8082, 1631, 3000 } meter conns_per_ip { ip saddr ct count over 30 } drop

        # ICMP (ping) con limitación de tasa (anti ping flood)
        ip protocol icmp limit rate 5/second accept

        # ─── DHCP (Kea, host network, entra por broadcast) ───
        udp dport 67 accept

        # ─── DNS — DC nativo ───
        tcp dport 53 accept
        udp dport 53 accept

        # ─── AD — Kerberos / LDAP / kpasswd / GC / RPC ───
        tcp dport { 88, 389, 636, 464, 3268, 3269, 135 } ip saddr 192.168.0.0/24 accept
        udp dport { 88, 389, 464 } ip saddr 192.168.0.0/24 accept
        # RPC dinámicos (necesarios para join completo de Windows)
        tcp dport 49152-65535 ip saddr 192.168.0.0/24 accept

        # ─── SMB / NetBIOS ───
        tcp dport { 139, 445 } ip saddr 192.168.0.0/24 accept
        udp dport { 137, 138 } ip saddr 192.168.0.0/24 accept

        # ─── NTP (chrony nativo) ───
        udp dport 123 ip saddr 192.168.0.0/24 accept

        # ─── RADIUS (WiFi 802.1X, FreeRADIUS nativo) ───
        # Solo el router hace de authenticator hacia el servidor RADIUS.
        udp dport 1812 ip saddr 192.168.0.1 accept

        # ─── HTTP/HTTPS y Webapps (puertos 80, 443, 8080, 8082, 8085, 3000, 5636, 9392) ───
        tcp dport { 80, 443, 8080, 8082, 8085, 3000, 5636, 9392 } accept

        # ─── Correo (contenedor mail) ───
        tcp dport { 25, 110, 143, 587, 993, 995 } accept

        # ─── Impresión CUPS (contenedor print) ───
        tcp dport 1631 accept

        # ─── MONITOREO (Zabbix server en 192.168.0.3) ───
        # Agente pasivo de dc1: el server consulta :10050 (checks pasivos).
        tcp dport 10050 ip saddr 192.168.0.3 accept

        # ─── MONITOREO LOCAL (sondas del blackbox_exporter) ───
        # El contenedor tso-blackbox (red Docker, origen 172.16.0.0/12)
        # prueba que el DC nativo responda en 53/88/389/445. Sin esto,
        # al llegar con policy drop daría un falso negativo de "servicio
        # caído". Solo esas 4 puertas, solo desde el rango Docker.
        tcp dport { 53, 88, 389, 445 } ip saddr 172.16.0.0/12 accept

        # ─── SOLO ADMINISTRADORES ───
        tcp dport { 22, 9443, 5432 } ip saddr @admin_ips accept

        # ─── SSH desde la red de gestión alternativa ───
        # Segunda conexión del server (192.168.100.0/24) por si la LAN
        # principal está caída o el WiFi quedó inaccesible.
        tcp dport 22 ip saddr 192.168.100.0/24 accept

        # Log + drop el resto (rate limit para no llenar logs)
        log prefix "[nft-drop] " limit rate 5/minute drop
    }

    # ── FORWARD: Docker necesita la chain abierta ─────────
    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    # ── OUTPUT: tráfico saliente abierto ──────────────────
    chain output {
        type filter hook output priority filter; policy accept;
    }
}