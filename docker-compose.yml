# docker-compose.yml — Servicios contenedor (TSO-II-final)
#
# Declara los servicios que corren en contenedores. El DC de Samba
# (Samba 4) corre NATIVO fuera de Docker → carpeta dc/.
#
# Uso:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose up -d <servicio>
#
# Reglas NO negociables (ver AGENTS.md):
#   * Puertos del DC (53, 88, 389, 445, 139, 636) NO se publican acá.
#   * Kea (dhcp) requiere network_mode: host (broadcast 67/udp).
#   * No hay services/dns ni services/files: DNS y SMB los da el DC.

name: tso-it

services:
  # ------------------------------------------------------------------
  # DHCP (Kea) — host network obligatorio (BOOTP usa broadcast)
  # ------------------------------------------------------------------
  dhcp:
    build: ./services/dhcp
    container_name: tso-dhcp
    # BOOTP/DHCP no funciona mapeando 67/udp por bridge; Kea escucha en
    # las interfaces físicas del host. No lleva ports: ni networks:.
    network_mode: host
    environment:
      DHCP_SUBNET: ${DHCP_SUBNET:-192.168.0.0/24}
      DHCP_POOL: ${DHCP_POOL:-192.168.0.100 - 192.168.0.199}
      # Vacío = detectar la interfaz de la ruta por defecto (recomendado).
      # Solo hace falta fijarla si el host tiene varias NIC.
      DHCP_INTERFACE: ${DHCP_INTERFACE:-}
      DHCP_DNS: ${DHCP_DNS:-192.168.0.2}
      DHCP_GATEWAY: ${DHCP_GATEWAY:-192.168.0.1}
      DHCP_NTP: ${DHCP_NTP:-192.168.0.2}
      DHCP_RESERVATIONS: ${DHCP_RESERVATIONS:-}
      DNS_DOMAIN: ${DNS_DOMAIN:-sudoers.lan}
    volumes:
      - dhcp_state:/var/lib/kea
    # CRÍTICO: Kea da las IPs de toda la red → siempre arriba al boot.
    # 'always' (no 'unless-stopped') garantiza arranque aunque se detenga
    # manualmente; si arranca antes que la red, Kea reintenta el socket.
    restart: always

  # ------------------------------------------------------------------
  # Web / Proxy inverso (Nginx) — *.sudoers.lan
  # ------------------------------------------------------------------
  web:
    build: ./services/web
    container_name: tso-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${WEB_SITE_DIR:-./services/web/public}:/usr/share/nginx/html:ro
      # TLS interno (CA + cert wildcard *.sudoers.lan). Generar con:
      #   sudo bash services/web/tls-gen.sh
      - ./services/web/tls:/etc/nginx/tls:ro
    networks:
      - tso-net
    # Portal de la intranet → siempre arriba al boot (*)
    restart: always

  # ------------------------------------------------------------------
  # Correo (Postfix + Dovecot)
  # ------------------------------------------------------------------
  mail:
    build: ./services/mail
    container_name: tso-mail
    ports:
      - "25:25"        # SMTP (transferencia entre servidores)
      - "587:587"      # SMTP Submission (clientes con auth)
      - "110:110"      # POP3
      - "143:143"      # IMAP
      - "993:993"      # IMAPS
      - "995:995"      # POP3S
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.sudoers.lan}
      MAIL_USERS: ${MAIL_USERS:-}
    volumes:
      - mail_data:/home
    networks:
      - tso-net
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Webmail (Roundcube)
  # ------------------------------------------------------------------
  webmail:
    image: roundcube/roundcubemail:${ROUNDCUBE_IMAGE_TAG:-1.7.4-apache}
    container_name: tso-webmail
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: tls://tso-mail
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: tls://tso-mail
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_USERNAME_DOMAIN: ${DNS_DOMAIN:-sudoers.lan}
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBE_DES_KEY:?ROUNDCUBE_DES_KEY debe estar definido en .env}
    volumes:
      - webmail_db:/var/roundcube/db
      - ./services/webmail/config:/var/roundcube/config:ro
    depends_on:
      - mail
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Gestor de archivos web (Filebrowser) — sobre los shares SMB del DC
  # ------------------------------------------------------------------
  filemanager:
    image: filebrowser/filebrowser:${FILEBROWSER_TAG:-v2.63.23}
    container_name: tso-files
    restart: unless-stopped
    # root + grupo primario = grupo del share (FILES_GID): los archivos que
    # se crean desde la web quedan root:<share-group> y el equipo puede
    # escribirlos también por SMB (fileMode 0664 / dirMode 0775).
    user: "0:${FILES_GID:-0}"
    entrypoint: ["/bin/tini", "--", "/bin/sh", "/entrypoint.sh"]
    environment:
      FILES_ADMIN_USER: ${FILES_ADMIN_USER:-admin}
      FILES_ADMIN_PASS: ${FILES_ADMIN_PASS:?FILES_ADMIN_PASS debe estar definido en .env}
      FILES_USERS: ${FILES_USERS:-}
      FILES_MIN_PASS_LEN: ${FILES_MIN_PASS_LEN:-10}
      FILES_FILE_MODE: ${FILES_FILE_MODE:-0664}
      FILES_DIR_MODE: ${FILES_DIR_MODE:-0775}
      FILES_UMASK: ${FILES_UMASK:-002}
    volumes:
      - ./services/filemanager/entrypoint.sh:/entrypoint.sh:ro
      - files_config:/config
      - files_db:/database
      # Solo los shares de equipo (los homes personales NO se publican)
      - ${FILES_SHARES_DIR:-/srv/samba}/departamentos:/srv/departamentos
      - ${FILES_SHARES_DIR:-/srv/samba}/respaldo:/srv/respaldo
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Base de datos (PostgreSQL)
  # ------------------------------------------------------------------
  database:
    build: ./services/database
    container_name: tso-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tso}
      POSTGRES_DB: ${POSTGRES_DB:-tso}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - tso-net
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Impresión (CUPS + PDF virtual)
  # ------------------------------------------------------------------
  print:
    build: ./services/print
    container_name: tso-print
    ports:
      - "${CUPS_PORT:-1631}:631"
    environment:
      CUPS_ADMIN_USER: ${CUPS_ADMIN_USER:-admin}
      CUPS_ADMIN_PASS: ${CUPS_ADMIN_PASS:-admin}
    volumes:
      - print_output:/var/spool/cups-pdf/OUT
    networks:
      - tso-net
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Portainer (panel de gestión Docker)
  # ------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: tso-portainer
    restart: unless-stopped
    ports:
      - "8000:8000"                      # Agente Edge / túnel remoto
      - "${PORTAINER_PORT:-9443}:9443"   # UI web (HTTPS autofirmado)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Monitoreo — Prometheus + Grafana + Alertmanager (+ exporters)
  #   services/monitoring/
  #
  #   * Solo Grafana se publica por el proxy → grafana.sudoers.lan
  #   * Prometheus y Alertmanager escuchan SOLO en 127.0.0.1 del host
  #     (acceso vía SSH tunnel: -L 9090:127.0.0.1:9090 / 9093)
  #   * Alertas por correo → contenedor tso-mail (Postfix de dc1)
  #   * Zabbix vive en el server físico 192.168.0.3 (services/zabbix)
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.15.0}
    container_name: tso-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      # Permite recargar la config con: curl -X POST http://127.0.0.1:9090/-/reload
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - tso-net

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_TAG:-v0.34.1}
    container_name: tso-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./services/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - tso-net

  # node_exporter: métricas del host dc1 + directorio de textfile
  # (ahí server/backup.sh escribe backup.prom)
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_TAG:-v1.12.1}
    container_name: tso-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /var/lib/tso-backup:/textfile:ro
    networks:
      - tso-net

  # cAdvisor: métricas de los contenedores (tso-*)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_TAG:-v0.55.1}
    container_name: tso-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - tso-net

  # Sondas de red: ¿responden DC y contenedores en su puerto/URL/DNS?
  # "dc1" se resuelve a la IP del host (host-gateway) para probar el DC
  # nativo (Samba + DNS) que corre fuera de Docker.
  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_TAG:-v0.28.0}
    container_name: tso-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    extra_hosts:
      # El DC nativo se prueba por su IP de LAN (HOST_IP en .env)
      - "dc1=${HOST_IP:-192.168.0.2}"
    volumes:
      - ./services/monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - tso-net

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-13.0.9}
    container_name: tso-grafana
    restart: unless-stopped
    # Solo en localhost: el exterior entra por el proxy (grafana.sudoers.lan)
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD debe estar definido en .env}
      GF_SECRET_KEY: ${GF_SECRET_KEY:?GF_SECRET_KEY debe estar definido en .env}
      GF_SERVER_ROOT_URL: https://grafana.sudoers.lan
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # EN DESARROLLO (fases posteriores)
  # ------------------------------------------------------------------
  # apps:         apps internas                 → services/apps      (Fase 5)
  #
  # MONITOREO (Zabbix): NO va acá → corre en un server Debian FÍSICO
  # dedicado (zabbix, 192.168.0.3) con su PROPIO compose (services/zabbix).
  # La web se accede directamente por DNS en `http://zabbix.sudoers.lan`; el
  # registro DNS se administra desde `dc/dns-records.sh`.
  # + server block en services/web/nginx.conf

# Volúmenes con nombre: los datos persisten aunque los contenedores se borren.
volumes:
  dhcp_state:
  mail_data:
  webmail_db:
  files_config:
  files_db:
  db_data:
  print_output:
  portainer_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

# Red interna del proyecto (interconexión de contenedores).
# Kea queda FUERA de esta red (network_mode: host).
networks:
  tso-net:
    driver: bridge

# NOTAS
# - DNS del dominio lo maneja el DC nativo (SAMBA_INTERNAL), no este compose.
# - Los recursos SMB los sirve el DC nativo (dc/shares.conf), no un contenedor.
# - El firewall del host (server/nftables.conf) controla qué puertos se
#   exponen a la LAN (5432, 9443 y 22 solo para admins).